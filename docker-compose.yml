services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data   # SQLite DB, CV, letters, token cache persist here
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  ollama:
